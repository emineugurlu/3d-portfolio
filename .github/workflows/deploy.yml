name: Deploy Vite Site

on:
  push:
    branches: ["main"] # Eğer ana dalın adı master ise burayı master yap

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite projeleri genelde dist klasörüne build eder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
